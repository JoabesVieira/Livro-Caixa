<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Livro Caixa</title>
<meta name="theme-color" content="#4A1E2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livro Caixa">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#4A1E2A; --surface:#5C2636; --surface2:#6E3040; --line:#7F3A4C;
  --ivory:#F5E9E2; --muted:#C79AA6; --gold:#D4A857; --income:#6FAE8E;
  --expense:#E05252; --warn:#E0A83E;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ivory);font-family:var(--sans);font-size:15px;
  padding-bottom:env(safe-area-inset-bottom);padding-top:env(safe-area-inset-top)}
button,input,select{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
input,select{background:var(--surface2);border:1px solid var(--line);color:var(--ivory);
  border-radius:3px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--serif);font-size:26px;font-weight:400;margin:4px 0 16px}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;border-radius:3px;
  font-family:var(--mono);font-size:13px;background:var(--surface2);border:1px solid var(--line)}
.btn-gold{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.card{background:var(--surface);border-radius:3px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;
  scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.tab{font-family:var(--mono);font-size:12px;padding:8px 13px;border-radius:3px;
  background:var(--surface);color:var(--muted);white-space:nowrap;flex:0 0 auto;
  border:1px solid transparent}
.tab.on{background:var(--gold);color:var(--bg)}
.grid3{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:24px}
@media(min-width:640px){.grid3{grid-template-columns:repeat(3,1fr)}h1{font-size:30px}}
@media(min-width:820px){.grid2{grid-template-columns:1fr 1fr}}
.stat{padding:14px 16px;border-left:3px solid var(--line)}
.stat .lbl{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.stat .v{font-family:var(--mono);font-size:19px}
.strip{display:flex;flex-wrap:wrap;gap:6px 20px;background:var(--surface2);padding:12px 16px;
  border-radius:3px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:24px}
.alerts{border:1px solid var(--line);border-radius:3px;background:var(--surface);margin-bottom:20px;overflow:hidden}
.alertgrp{padding:12px 16px;border-left:3px solid}
.alertrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
.alertrow span.d{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.mini{font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:3px;
  background:var(--surface2);border:1px solid var(--line);color:var(--gold);white-space:nowrap}
.panel{padding:16px}
.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:flex;gap:4px}
.seg button{font-family:var(--mono);font-size:10px;padding:5px 9px;border-radius:3px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px}
.legend button{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.hint{font-family:var(--mono);font-size:10px;color:var(--line);margin-top:8px}
.bud{padding:12px 14px;background:var(--surface);border-radius:3px;margin-bottom:8px}
.budtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}
.budtop .r{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 auto}
.budtop input{width:88px;padding:3px 7px;font-family:var(--mono);font-size:12px}
.bar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-family:var(--mono);font-size:11px;padding:7px 11px;border-radius:3px;background:var(--surface);color:var(--muted)}
.chip.on{background:var(--gold);color:var(--bg)}
.chip.cat{background:var(--surface2);color:var(--ivory);border:1px solid var(--line)}
.list{background:var(--surface);border-radius:3px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .l{display:flex;align-items:center;gap:12px;min-width:0}
.tick{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;color:var(--bg)}
.tick.pend{background:transparent;border:1.5px dashed var(--muted);color:transparent}
.tick.late{border-color:var(--expense)}
.row .t{min-width:0}
.row .t p{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:2px}
.row .r{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.amt{font-family:var(--mono);font-size:13px;white-space:nowrap}
.run{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.del{opacity:.45;padding:4px;font-size:14px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border-radius:3px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:50;overflow-y:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px;width:100%;max-width:400px}
.sheet h2{font-family:var(--serif);font-size:18px;font-weight:400}
.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.two{display:flex;gap:8px;margin-bottom:10px}
.two button{flex:1;padding:10px;border-radius:3px;font-family:var(--mono);font-size:12px;
  background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.field{margin-bottom:10px}
.half{display:flex;gap:8px;margin-bottom:10px}
.half>*{width:50%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:60;
  font-family:var(--mono);font-size:12px;padding:11px 16px;border-radius:3px;
  background:var(--surface2);border:1px solid var(--line);max-width:90%}
.hidden{display:none!important}
svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <p class="eyebrow">livro-caixa · pessoal</p>
    <h1>Meu Livro Caixa</h1>
    <div class="actions">
      <button class="btn btn-gold" id="btnAdd">+ Lançamento</button>
      <button class="btn" id="btnImport">↑ Importar Excel</button>
      <button class="btn" id="btnExport">↓ Exportar Excel</button>
      <button class="btn hidden" id="btnNotif">🔔 Ativar avisos</button>
      <input type="file" id="fileInput" class="hidden"
        accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,text/comma-separated-values,public.data">
    </div>
  </div>

  <div id="alerts"></div>

  <div class="tabs" id="tabs"></div>

  <div id="mainDash">
    <div class="grid3" id="statCards"></div>

    <div class="grid2" id="charts">
      <div class="card panel">
        <div class="panelhead">
          <span class="lbl">Por categoria</span>
          <div class="seg" id="pieSeg">
            <button data-m="expense" class="on">Despesas</button>
            <button data-m="income">Receitas</button>
          </div>
        </div>
        <div id="pieWrap"></div>
      </div>
      <div class="card panel">
        <div class="panelhead"><span class="lbl">Últimos 6 meses</span></div>
        <div id="barWrap"></div>
      </div>
    </div>

    <div style="margin-bottom:24px" id="budgetsSection">
      <div class="panelhead">
        <span class="lbl">Orçamento por categoria</span>
        <button class="mono" id="btnBud" style="font-size:11px;color:var(--gold)">editar limites</button>
      </div>
      <div id="budgets"></div>
    </div>
  </div>

  <div id="forecastStrip" class="hidden"></div>

  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>

<div class="modal hidden" id="modal">
  <div class="sheet">
    <div class="sheettop"><h2>Novo lançamento</h2><button id="btnClose" style="color:var(--muted)">✕</button></div>
    <div class="two" id="typeSeg">
      <button data-v="expense" class="on">Despesa</button>
      <button data-v="income">Receita</button>
    </div>
    <div class="field"><input type="text" id="fDesc" placeholder="Descrição"></div>
    <div class="field"><select id="fCat"></select></div>
    <div class="half">
      <input type="number" inputmode="decimal" id="fAmt" placeholder="Valor">
      <input type="date" id="fDate">
    </div>
    <div class="two" id="statusSeg">
      <button data-v="settled" class="on">Já paguei</button>
      <button data-v="pending">Em aberto</button>
    </div>
    <button class="btn btn-gold" id="btnSave" style="width:100%;justify-content:center;padding:12px">Adicionar</button>
  </div>
</div>

<script src="lib/xlsx.full.min.js"></script>
<script>
const EXPENSE_CATS=["Alimentação","Moradia","Transporte","Lazer","Saúde","Educação","Outros"];
const INCOME_CATS=["Salário","Freelance","Investimentos","Outros"];
const PIE=["#D4A857","#6FAE8E","#E05252","#8AA6C7","#C79AA6","#B98CC9","#E0A83E"];
const C={income:"#6FAE8E",expense:"#E05252",gold:"#D4A857",warn:"#E0A83E",muted:"#C79AA6",line:"#7F3A4C",surface:"#5C2636",surface2:"#6E3040",ivory:"#F5E9E2"};

let tx=[], budgets={}, statusFilter="all", catFilter=null, pieMode="expense", editBud=false;
let activeTab="all";
let form={type:"expense",status:"settled"};

const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const brl=n=>(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("pt-BR");
const daysUntil=d=>Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();

function save(){
  try{
    localStorage.setItem("livrocaixa.tx",JSON.stringify(tx));
    localStorage.setItem("livrocaixa.budgets",JSON.stringify(budgets));
  }catch(e){toast("Não foi possível salvar neste dispositivo.")}
}
function load(){
  try{
    const t=localStorage.getItem("livrocaixa.tx");
    if(t)tx=JSON.parse(t).map(x=>({...x,status:x.status||"settled",dueDate:x.dueDate||x.date}));
    const b=localStorage.getItem("livrocaixa.budgets");
    if(b)budgets=JSON.parse(b);
  }catch(e){}
}
let toastTimer;
function toast(msg){
  let el=document.querySelector(".toast");
  if(!el){el=document.createElement("div");el.className="toast";document.body.appendChild(el)}
  el.textContent=msg;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.remove(),4000);
}

/* ---------- derived ---------- */
function sorted(list){return [...list].sort((a,b)=>a.dueDate<b.dueDate?1:-1)}
function totals(list){
  let income=0,expense=0,toReceive=0,toPay=0;
  for(const t of list){
    if(t.status==="settled"){t.type==="income"?income+=t.amount:expense+=t.amount}
    else{t.type==="income"?toReceive+=t.amount:toPay+=t.amount}
  }
  return{income,expense,saldo:income-expense,toReceive,toPay};
}
function byCat(type,list){
  const m={};
  for(const t of list){if(t.type!==type)continue;m[t.category]=(m[t.category]||0)+t.amount}
  return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
}
function alertsData(){
  const overdue=[],soon=[];
  for(const t of tx){
    if(t.status!=="pending")continue;
    const d=daysUntil(t.dueDate);
    if(d<0)overdue.push(t);else if(d<=7)soon.push(t);
  }
  const s=(a,b)=>a.dueDate>b.dueDate?1:-1;
  return{overdue:overdue.sort(s),soon:soon.sort(s)};
}
function scopedTx(){
  if(activeTab==="all")return tx;
  if(activeTab==="forecast")return tx.filter(t=>t.status==="pending");
  return tx.filter(t=>t.dueDate.slice(0,7)===activeTab);
}
function monthKeys(){
  return [...new Set(tx.map(t=>t.dueDate.slice(0,7)))].sort();
}
function monthLabel(key){
  const [y,m]=key.split("-");
  const d=new Date(Number(y),Number(m)-1,1);
  const showYear=new Set(monthKeys().map(k=>k.split("-")[0])).size>1;
  const lbl=d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","");
  return showYear?`${lbl}/${y.slice(2)}`:lbl;
}

/* ---------- charts ---------- */
function arc(cx,cy,r,r2,a0,a1){
  const p=(a,rad)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
  const big=a1-a0>Math.PI?1:0;
  const [x0,y0]=p(a0,r),[x1,y1]=p(a1,r),[x2,y2]=p(a1,r2),[x3,y3]=p(a0,r2);
  return`M${x0} ${y0}A${r} ${r} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r2} ${r2} 0 ${big} 0 ${x3} ${y3}Z`;
}
function renderPie(scope){
  const data=byCat(pieMode,scope);
  const w=$("pieWrap");
  if(!data.length){
    w.innerHTML=`<p style="text-align:center;padding:44px 0;color:var(--muted);font-size:14px">Sem ${pieMode==="expense"?"despesas":"receitas"} neste recorte</p>`;
    return;
  }
  const total=data.reduce((s,d)=>s+d.value,0);
  let a=-Math.PI/2,paths="";
  data.forEach((d,i)=>{
    const a1=a+(d.value/total)*Math.PI*2;
    const sel=catFilter===d.name;
    paths+=`<path d="${arc(100,100,78,48,a+0.012,a1-0.012)}" fill="${PIE[i%PIE.length]}"
      stroke="${sel?C.ivory:C.surface}" stroke-width="${sel?2:1}" data-cat="${esc(d.name)}" style="cursor:pointer"></path>`;
    a=a1;
  });
  w.innerHTML=`<svg viewBox="0 0 200 200" style="max-width:240px;margin:0 auto">
    ${paths}
    <text x="100" y="94" text-anchor="middle" fill="${C.muted}" font-family="var(--mono)" font-size="9">TOTAL</text>
    <text x="100" y="110" text-anchor="middle" fill="${C.ivory}" font-family="var(--mono)" font-size="13">${brl(total)}</text>
  </svg>
  <div class="legend">${data.map((d,i)=>`<button data-cat="${esc(d.name)}" style="opacity:${catFilter&&catFilter!==d.name?.4:1}">
    <span class="dot" style="background:${PIE[i%PIE.length]}"></span>${esc(d.name)} ${Math.round(d.value/total*100)}%</button>`).join("")}</div>
  <p class="hint">toque numa fatia para filtrar a lista</p>`;
  w.querySelectorAll("[data-cat]").forEach(el=>el.onclick=()=>{
    const c=el.dataset.cat;catFilter=catFilter===c?null:c;render();
  });
}
function renderBar(){
  const now=new Date(),months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({key:d.toISOString().slice(0,7),label:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")});
  }
  const map={};months.forEach(m=>map[m.key]={inc:0,exp:0});
  for(const t of tx){const k=t.dueDate.slice(0,7);if(map[k]){t.type==="income"?map[k].inc+=t.amount:map[k].exp+=t.amount}}
  const vals=months.map(m=>map[m.key]);
  const max=Math.max(1,...vals.flatMap(v=>[v.inc,v.exp]));
  const W=340,H=180,pad=26,bw=(W-pad*2)/6;
  let bars="";
  vals.forEach((v,i)=>{
    const x=pad+i*bw;
    const hi=(v.inc/max)*(H-40),he=(v.exp/max)*(H-40);
    const on=months[i].key===activeTab;
    bars+=`<g data-mkey="${months[i].key}" style="cursor:pointer">`;
    if(on)bars+=`<rect x="${x+1}" y="6" width="${bw-2}" height="${H-30}" fill="${C.surface2}" rx="3"></rect>`;
    bars+=`<rect x="${x+bw*0.14}" y="${H-24-hi}" width="${bw*0.3}" height="${hi}" fill="${C.income}" rx="2"></rect>`;
    bars+=`<rect x="${x+bw*0.52}" y="${H-24-he}" width="${bw*0.3}" height="${he}" fill="${C.expense}" rx="2"></rect>`;
    bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" fill="${on?C.gold:C.muted}" font-size="10">${months[i].label}</text>`;
    bars+="</g>";
  });
  $("barWrap").innerHTML=`<svg viewBox="0 0 ${W} ${H}">
    <line x1="${pad}" y1="${H-24}" x2="${W-pad}" y2="${H-24}" stroke="${C.line}"></line>
    ${bars}</svg>
    <div class="legend"><span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><span class="dot" style="background:${C.income}"></span>Receitas</span>
    <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)"><span class="dot" style="background:${C.expense}"></span>Despesas</span></div>`;
  $("barWrap").querySelectorAll("[data-mkey]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.mkey;
    if(monthKeys().includes(k)){activeTab=activeTab===k?"all":k;render()}
    else toast("Sem lançamentos nesse mês ainda.");
  });
}

/* ---------- render ---------- */
function render(){
  const scope=scopedTx();
  const isForecast=activeTab==="forecast";
  const gt=totals(tx);

  /* tabs */
  const items=[["all","Visão geral"],["forecast","Previsto"],...monthKeys().map(k=>[k,monthLabel(k)])];
  $("tabs").innerHTML=items.map(([v,l])=>`<button class="tab ${activeTab===v?"on":""}" data-tab="${v}">${l}</button>`).join("");
  $("tabs").querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{activeTab=el.dataset.tab;catFilter=null;render()});

  /* alerts: sempre globais */
  const a=alertsData();
  let ah="";
  const grp=(items,color,title)=>`<div class="alertgrp" style="border-left-color:${color};${ah?"border-top:1px solid var(--line)":""}">
    <div class="lbl" style="color:${color};margin-bottom:8px">${title}</div>
    ${items.slice(0,5).map(t=>{const d=daysUntil(t.dueDate);
      return`<div class="alertrow"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.description)} · ${brl(t.amount)}</span>
      <span style="display:flex;gap:8px;align-items:center"><span class="d">${d<0?Math.abs(d)+"d atrás":d===0?"hoje":d===1?"amanhã":d+"d"}</span>
      <button class="mini" data-tick="${t.id}">${t.type==="income"?"recebi":"paguei"}</button></span></div>`}).join("")}</div>`;
  if(a.overdue.length)ah+=grp(a.overdue,C.expense,`⚠ ${a.overdue.length} vencido(s)`);
  if(a.soon.length)ah+=grp(a.soon,C.warn,"⏱ Vence em até 7 dias");
  $("alerts").innerHTML=ah?`<div class="alerts">${ah}</div>`:"";

  /* forecast strip: sempre visível, dados globais */
  const fs=$("forecastStrip");
  fs.classList.remove("hidden");
  fs.innerHTML=`<div class="strip">
    <span>Saldo realizado <b style="color:${gt.saldo>=0?C.gold:C.expense}">${brl(gt.saldo)}</b></span>
    <span>A receber <b style="color:${C.income}">${brl(gt.toReceive)}</b></span>
    <span>A pagar <b style="color:${C.expense}">${brl(gt.toPay)}</b></span>
    <span>Saldo previsto <b style="color:${C.gold}">${brl(gt.saldo+gt.toReceive-gt.toPay)}</b></span>
  </div>`;

  if(isForecast){
    $("mainDash").classList.add("hidden");
  }else{
    $("mainDash").classList.remove("hidden");
    const t=totals(scope);
    $("statCards").innerHTML=`
      <div class="card stat" style="border-left-color:var(--income)">
        <div class="lbl">Recebido</div><div class="v" style="color:${C.income}">${brl(t.income)}</div>
      </div>
      <div class="card stat" style="border-left-color:var(--expense)">
        <div class="lbl">Pago</div><div class="v" style="color:${C.expense}">${brl(t.expense)}</div>
      </div>
      <div class="card stat" style="border-left-color:var(--gold)">
        <div class="lbl">Saldo do recorte</div><div class="v" style="color:${t.saldo>=0?C.gold:C.expense}">${brl(t.saldo)}</div>
      </div>`;

    renderPie(scope);renderBar();

    const spentMap={};byCat("expense",scope).forEach(c=>spentMap[c.name]=c.value);
    const cats=[...EXPENSE_CATS,...Object.keys(spentMap).filter(c=>!EXPENSE_CATS.includes(c))];
    $("btnBud").textContent=editBud?"fechar edição":"editar limites";
    $("budgets").innerHTML=cats.map(c=>{
      const spent=spentMap[c]||0,lim=budgets[c]||0,over=lim>0&&spent>lim;
      const pct=lim>0?Math.min(100,spent/lim*100):0;
      return`<div class="bud"><div class="budtop"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c)}</span>
      <span class="r"><span style="color:${over?C.expense:C.ivory}">${brl(spent)}</span>
      ${editBud?`<input type="number" inputmode="decimal" data-bud="${esc(c)}" value="${lim||""}" placeholder="limite">`
        :`<span>/ ${lim>0?brl(lim):"sem limite"}</span>`}</span></div>
      ${lim>0?`<div class="bar"><i style="width:${pct}%;background:${over?C.expense:C.gold}"></i></div>`:""}</div>`;
    }).join("");
    $("budgets").querySelectorAll("[data-bud]").forEach(el=>el.onchange=()=>{
      budgets[el.dataset.bud]=Number(el.value)||0;save();render();
    });
  }

  /* chips + lista */
  if(isForecast){
    $("chips").innerHTML=catFilter?`<button class="chip cat" data-clear="1">${esc(catFilter)} ✕</button>`:"";
  }else{
    const nPend=scope.filter(x=>x.status==="pending").length;
    const chipsArr=[["all",`Todos · ${scope.length}`],["pending",`Pendentes · ${nPend}`],["settled",`Quitados · ${scope.length-nPend}`]];
    $("chips").innerHTML=chipsArr.map(([v,l])=>`<button class="chip ${statusFilter===v?"on":""}" data-f="${v}">${l}</button>`).join("")
      +(catFilter?`<button class="chip cat" data-clear="1">${esc(catFilter)} ✕</button>`:"");
    $("chips").querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{statusFilter=el.dataset.f;render()});
  }
  const clr=$("chips").querySelector("[data-clear]");if(clr)clr.onclick=()=>{catFilter=null;render()};

  let vis;
  if(isForecast){
    vis=sorted(scope).slice().reverse(); // ascendente: proximo vencimento primeiro
    if(catFilter)vis=vis.filter(t=>t.category===catFilter);
  }else{
    vis=sorted(scope).filter(t=>{
      if(statusFilter==="pending"&&t.status!=="pending")return false;
      if(statusFilter==="settled"&&t.status!=="settled")return false;
      if(catFilter&&t.category!==catFilter)return false;
      return true;
    });
  }

  if(!vis.length){
    $("list").innerHTML=`<div class="empty">${tx.length?"Nenhum lançamento com esse filtro.":"Nenhum lançamento ainda. Adicione o primeiro ou importe sua planilha."}</div>`;
  }else if(isForecast){
    let running=gt.saldo;
    const runs=vis.map(t=>{running+=t.type==="income"?t.amount:-t.amount;return running});
    $("list").innerHTML=`<div class="list">${vis.map((t,i)=>{
      const late=daysUntil(t.dueDate)<0;
      return`<div class="row"><div class="l">
        <button class="tick pend ${late?"late":""}" data-tick="${t.id}" aria-label="Marcar como quitado">✓</button>
        <div class="t"><p>${esc(t.description)}</p>
        <small style="color:${late?C.expense:C.muted}">${esc(t.category)} · ${fmt(t.dueDate)}${late?" · vencido":""}</small></div></div>
        <div class="r"><div style="text-align:right">
          <div class="amt" style="color:${t.type==="income"?C.income:C.expense}">${t.type==="income"?"+":"−"} ${brl(t.amount)}</div>
          <div class="run">saldo: ${brl(runs[i])}</div>
        </div>
        <button class="del" data-del="${t.id}" aria-label="Excluir">🗑</button></div></div>`;
    }).join("")}</div>`;
  }else{
    $("list").innerHTML=`<div class="list">${vis.map((t,i)=>{
      const pend=t.status==="pending",late=pend&&daysUntil(t.dueDate)<0;
      return`<div class="row"><div class="l">
        <button class="tick ${pend?"pend":""} ${late?"late":""}" data-tick="${t.id}"
          style="${pend?"":`background:${t.type==="income"?C.income:C.expense}`}"
          aria-label="${pend?"Marcar como quitado":"Marcar como pendente"}">✓</button>
        <div class="t"><p>${esc(t.description)}</p>
        <small style="color:${late?C.expense:C.muted}">${esc(t.category)} · ${fmt(t.dueDate)}${pend?(late?" · vencido":" · pendente"):""}</small></div></div>
        <div class="r"><span class="amt" style="color:${t.type==="income"?C.income:C.expense};opacity:${pend?.6:1}">${t.type==="income"?"+":"−"} ${brl(t.amount)}</span>
        <button class="del" data-del="${t.id}" aria-label="Excluir">🗑</button></div></div>`;
    }).join("")}</div>`;
  }

  document.querySelectorAll("[data-tick]").forEach(el=>el.onclick=()=>{
    const t=tx.find(x=>x.id===el.dataset.tick);
    if(t){t.status=t.status==="settled"?"pending":"settled";save();render()}
  });
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{
    tx=tx.filter(x=>x.id!==el.dataset.del);save();render();
  });
}

/* ---------- form ---------- */
function fillCats(){
  const list=form.type==="expense"?EXPENSE_CATS:INCOME_CATS;
  $("fCat").innerHTML=list.map(c=>`<option>${esc(c)}</option>`).join("");
}
function openForm(){
  form={type:"expense",status:"settled"};
  $("fDesc").value="";$("fAmt").value="";
  $("fDate").value=(activeTab.match(/^\d{4}-\d{2}$/))?activeTab+"-01":today();
  syncSeg();fillCats();$("modal").classList.remove("hidden");$("fDesc").focus();
}
function syncSeg(){
  $("typeSeg").querySelectorAll("button").forEach(b=>{
    const on=b.dataset.v===form.type;
    b.style.background=on?(form.type==="expense"?C.expense:C.income):C.surface2;
    b.style.color=on?"#4A1E2A":C.muted;b.style.borderColor=on?"transparent":C.line;
  });
  $("statusSeg").querySelectorAll("button").forEach(b=>{
    const on=b.dataset.v===form.status;
    b.style.background=on?C.surface2:"transparent";
    b.style.color=on?C.gold:C.muted;b.style.borderColor=on?C.gold:C.line;
    if(b.dataset.v==="settled")b.textContent=form.type==="income"?"Já recebi":"Já paguei";
  });
}
$("typeSeg").onclick=e=>{if(e.target.dataset.v){form.type=e.target.dataset.v;syncSeg();fillCats()}};
$("statusSeg").onclick=e=>{if(e.target.dataset.v){form.status=e.target.dataset.v;syncSeg()}};
$("btnAdd").onclick=openForm;
$("btnClose").onclick=()=>$("modal").classList.add("hidden");
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.add("hidden")};
$("btnBud").onclick=()=>{editBud=!editBud;render()};
$("pieSeg").onclick=e=>{
  if(!e.target.dataset.m)return;
  pieMode=e.target.dataset.m;
  $("pieSeg").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===pieMode));
  render();
};
$("btnSave").onclick=()=>{
  const d=$("fDesc").value.trim(),a=Number($("fAmt").value);
  if(!d||!a||a<=0){toast("Preencha descrição e valor.");return}
  const date=$("fDate").value||today();
  tx.unshift({id:uid(),type:form.type,description:d,category:$("fCat").value,amount:a,date,dueDate:date,status:form.status});
  save();$("modal").classList.add("hidden");render();
};

/* ---------- excel ---------- */
$("btnExport").onclick=()=>{
  if(!tx.length){toast("Nada para exportar ainda.");return}
  const t=totals(tx);
  const rows=sorted(tx).map(x=>({
    Vencimento:fmt(x.dueDate),Tipo:x.type==="income"?"Receita":"Despesa",
    "Descrição":x.description,Categoria:x.category,
    Valor:x.type==="income"?x.amount:-x.amount,
    "Situação":x.status==="settled"?(x.type==="income"?"Recebido":"Pago"):"Pendente"
  }));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:12},{wch:10},{wch:32},{wch:16},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,"Lançamentos");
  const resumo=[{Indicador:"Receitas recebidas",Valor:t.income},{Indicador:"Despesas pagas",Valor:t.expense},
    {Indicador:"Saldo realizado",Valor:t.saldo},{Indicador:"A receber",Valor:t.toReceive},
    {Indicador:"A pagar",Valor:t.toPay},{Indicador:"Saldo previsto",Valor:t.saldo+t.toReceive-t.toPay},{},
    ...byCat("expense",tx).map(c=>({Indicador:"Despesa · "+c.name,Valor:c.value}))];
  const ws2=XLSX.utils.json_to_sheet(resumo);ws2["!cols"]=[{wch:28},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws2,"Resumo");
  XLSX.writeFile(wb,`livro-caixa-${today()}.xlsx`);
  toast("Planilha gerada.");
};
$("btnImport").onclick=()=>{
  if(typeof XLSX==="undefined"){toast("Biblioteca de Excel não carregou. Confira a pasta lib.");return}
  $("fileInput").click();
};
function parseAmt(v){
  if(typeof v==="number")return v;
  const s=String(v||"").replace(/[R$\s]/g,"").replace(/\./g,"").replace(",",".");
  const n=parseFloat(s);return isNaN(n)?0:n;
}
function parseDt(v){
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  const s=String(v||"").trim();
  const br=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(br){const y=br[3].length===2?"20"+br[3]:br[3];return`${y}-${br[2].padStart(2,"0")}-${br[1].padStart(2,"0")}`}
  const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return iso?iso[0]:null;
}
function findKey(row,cands){
  const keys=Object.keys(row);
  for(const c of cands){const h=keys.find(k=>norm(k).includes(c));if(h)return h}
  return null;
}
$("fileInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:"array",cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      if(!rows.length){toast("Planilha vazia ou sem cabeçalho na primeira linha.");return}
      const s=rows[0];
      const kD=findKey(s,["vencimento","data","date","dia"]),kX=findKey(s,["descricao","historico","lancamento","item"]),
        kC=findKey(s,["categoria","classificacao"]),kV=findKey(s,["valor","amount","total"]),
        kT=findKey(s,["tipo","type","natureza"]),kS=findKey(s,["situacao","status","pago","quitado"]);
      if(!kV){toast('Não achei a coluna de valor. Renomeie para "Valor".');return}
      const imp=[];
      for(const row of rows){
        const raw=parseAmt(row[kV]);if(!raw)continue;
        let type;
        if(kT){const v=norm(row[kT]);type=(v.startsWith("r")||v.includes("entrada")||v.includes("credito"))?"income":"expense"}
        else type=raw>=0?"income":"expense";
        let st="settled";
        if(kS){const v=norm(row[kS]);if(v.includes("pend")||v.includes("aberto")||v==="nao"||v==="n")st="pending"}
        const d=(kD?parseDt(row[kD]):null)||today();
        imp.push({id:uid(),type,description:(kX?String(row[kX]).trim():"")||"Importado do Excel",
          category:(kC?String(row[kC]).trim():"")||"Outros",amount:Math.abs(raw),date:d,dueDate:d,status:st});
      }
      if(!imp.length){toast("Nenhuma linha com valor válido.");return}
      tx=[...imp,...tx];save();render();toast(imp.length+" lançamento(s) importado(s).");
    }catch(err){toast("Falha ao ler: "+(err&&err.message?err.message:"arquivo não reconhecido"))}
  };
  r.readAsArrayBuffer(f);e.target.value="";
};

/* ---------- notifications ---------- */
function notifyDue(){
  if(!("Notification"in window)||Notification.permission!=="granted")return;
  const key="livrocaixa.notified."+today();
  if(localStorage.getItem(key))return;
  const a=alertsData();
  const hoje=a.soon.filter(t=>daysUntil(t.dueDate)<=1).length;
  if(!a.overdue.length&&!hoje)return;
  const parts=[];
  if(a.overdue.length)parts.push(`${a.overdue.length} vencida(s)`);
  if(hoje)parts.push(`${hoje} vencendo`);
  new Notification("Livro Caixa",{body:`Você tem ${parts.join(" e ")}.`,icon:"icon-192.png",tag:"livrocaixa-due"});
  localStorage.setItem(key,"1");
}
if("Notification"in window&&Notification.permission==="default"){
  $("btnNotif").classList.remove("hidden");
  $("btnNotif").onclick=async()=>{
    const p=await Notification.requestPermission();
    if(p==="granted"){$("btnNotif").classList.add("hidden");notifyDue();toast("Avisos ativados.")}
    else toast("Avisos não autorizados pelo navegador.");
  };
}

/* ---------- boot ---------- */
load();render();notifyDue();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)notifyDue()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
